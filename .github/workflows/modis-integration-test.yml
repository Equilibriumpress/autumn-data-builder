name: MODIS integration test

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/download_modis_year.py
      - scripts/discover_modis_matrix.py
      - scripts/build_modis_group.py
      - .github/workflows/modis-integration-test.yml

permissions:
  contents: read

jobs:
  modis-native-group:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout private iOS pipeline
        uses: actions/checkout@v4
        with:
          repository: Equilibriumpress/ios-autumn
          ref: main
          token: ${{ secrets.IOS_AUTUMN_TOKEN }}
          path: _ios-autumn
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install GDAL and Python dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev sqlite3 zstd
          python -m pip install -r requirements.txt
          gdalinfo --formats | grep -q HDF4

      - id: tile
        name: Discover one real native MCD12Q2 tile
        shell: bash
        run: |
          python scripts/discover_modis_matrix.py --year 2024 --lat-min 45 --lat-max 60 --group-size 1 --output matrix.json >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          item=json.load(open('matrix.json'))['include'][0]
          print('id='+item['id'])
          print('tiles='+item['tiles'])
          print('asset='+item['asset'])
          PY

      - name: Build one native MODIS observation group
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        shell: bash
        run: |
          python scripts/build_modis_group.py \
            --id "${{ steps.tile.outputs.id }}" \
            --asset "${{ steps.tile.outputs.asset }}" \
            --tiles "${{ steps.tile.outputs.tiles }}" \
            --years 2024 \
            --cell-degrees 0.2 \
            --pipeline-dir _ios-autumn/DataPipeline \
            --output .integration/output

      - name: Validate reduced cache SQLite
        env:
          ASSET: ${{ steps.tile.outputs.asset }}
        shell: bash
        run: |
          zstd -d ".integration/output/${ASSET}.sqlite.zst" -o .integration/cache.sqlite
          count=$(sqlite3 .integration/cache.sqlite 'SELECT COUNT(*) FROM phenology_observations;')
          echo "Native tile: ${{ steps.tile.outputs.tiles }}"
          echo "Phenology observations: $count"
          test "$count" -gt 0
          sqlite3 .integration/cache.sqlite 'PRAGMA integrity_check;' | grep -qx ok
