name: Start production once

on:
  push:
    paths:
      - .github/workflows/start-production-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run build-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f years='2014:2024' \
            -f cell_degrees='0.2' \
            -f max_bundle_mib='95' \
            -f pipeline_ref='main' \
            -f publish_to_ios='true'
