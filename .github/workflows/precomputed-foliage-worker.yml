name: Precomputed foliage worker

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Maximum queued jobs this run
        required: false
        default: '24'
      bootstrap_jobs:
        description: Maximum new 5-degree discovery jobs to enqueue
        required: false
        default: '60'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: autumn-precomputed-foliage-worker
  cancel-in-progress: false

jobs:
  foliage-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.AUTUMN_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTUMN_SUPABASE_SERVICE_ROLE_KEY }}
      MAX_JOBS: ${{ inputs.max_jobs || '24' }}
      BOOTSTRAP_JOBS: ${{ inputs.bootstrap_jobs || '60' }}
      REQUEST_DELAY_SECONDS: '1.0'
      WORKER_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Autumn Atlas worker configuration is present.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Worker skipped: configure AUTUMN_SUPABASE_URL and AUTUMN_SUPABASE_SERVICE_ROLE_KEY repository secrets.'
          fi
      - name: Process foliage update queue
        if: steps.config.outputs.configured == 'true'
        run: python3 scripts/run_foliage_worker.py
