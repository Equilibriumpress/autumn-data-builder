name: Stop production build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-production.yml'

concurrency:
  group: autumn-production-data
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cancelling active Autumn production build via shared concurrency group."
