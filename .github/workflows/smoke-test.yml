name: Builder smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py

      - name: Validate shard matrix
        shell: bash
        run: |
          python scripts/make_matrix.py > matrix.json
          python - <<'PY'
          import json
          data = json.load(open('matrix.json'))
          shards = data['include']
          assert len(shards) == 126, len(shards)
          assert len({item['id'] for item in shards}) == 126
          assert min(item['min_lat'] for item in shards) == -60
          assert max(item['max_lat'] for item in shards) == 80
          assert min(item['min_lon'] for item in shards) == -180
          assert max(item['max_lon'] for item in shards) == 180
          print('Matrix OK:', len(shards), 'shards')
          PY

      - name: Validate workflow files are present
        run: |
          test -s .github/workflows/build-production.yml
          test -s scripts/build_shard.py
          test -s scripts/merge_shards.py
